<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Effet</title>
<style>
@font-face { font-family: "Geist"; src: url("polices/geist-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Geist"; src: url("polices/geist-latin-ext-wght-normal.woff2") format("woff2"); font-weight: 100 900; unicode-range: U+0100-02AF; }
@font-face { font-family: "JetBrains Mono"; src: url("polices/jetbrains-mono-latin-wght-normal.woff2") format("woff2"); font-weight: 100 800; }
@font-face { font-family: "Instrument Serif"; src: url("polices/instrument-serif-latin-400-italic.woff2") format("woff2"); font-style: italic; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #000; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; font-family: "Geist", -apple-system, sans-serif; color: #f5f4ef; }
.rbg { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, #1d2433 0%, #0a0c11 60%, #050506 100%); }
#stage .vid { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ringstage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; perspective: 1100px; perspective-origin: 50% 43%; }
.ring { position: absolute; left: 350px; top: 470px; width: 380px; height: 676px; transform-style: preserve-3d; }
.rcard { position: absolute; inset: 0; border-radius: 28px; border: 2px solid rgba(255,255,255,.12); overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.6); backface-visibility: hidden; }
.rcard img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ringglow { position: absolute; left: 140px; top: 360px; width: 800px; height: 600px; border-radius: 50%; background: radial-gradient(closest-side, rgba(120,170,255,.35), rgba(0,0,0,0)); }
.ledcv { position: absolute; inset: 0; }
.cmp-before { filter: grayscale(.85) contrast(.72) brightness(1.25); }
.cmp-after { position: absolute; inset: 0; }
.cmp-grade { filter: contrast(1.14) saturate(1.25) brightness(.97); }
.cmp-warm { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, rgba(255,170,90,.16), rgba(0,0,0,.35) 85%); mix-blend-mode: soft-light; }
.cmp-bar { position: absolute; left: 0; top: 0; width: 0; height: 1920px; }
.cmp-bar i { position: absolute; left: -3px; top: 0; width: 6px; height: 1920px; background: #fff; box-shadow: 0 0 24px rgba(0,0,0,.6); }
.cmp-bar b { position: absolute; left: -58px; top: 900px; width: 116px; height: 116px; border-radius: 50%; background: #fff; color: #1a1a1a; font: 800 44px/116px "Geist", sans-serif; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.cmp-pill { position: absolute; left: 50px; top: 300px; padding: 12px 26px; border-radius: 40px; background: rgba(0,0,0,.55); color: #fff; font: 700 34px "Geist", sans-serif; letter-spacing: .08em; }
.cmp-pill.on { left: auto; right: 50px; background: #d97757; }
.cmp-cap { position: absolute; left: 0; top: 1380px; width: 1080px; text-align: center; white-space: normal; padding: 0 24px; font: 800 84px/1.1 "Geist", sans-serif; color: #fff; text-shadow: 0 6px 24px rgba(0,0,0,.8), 0 0 2px #000; }
.cmp-cap span { display: inline-block; padding: 0 10px; border-radius: 16px; }
.cmp-cap span.hot { background: #ffd84d; color: #111; text-shadow: none; }
.ledwall { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 38%, #1c2230 0%, #0b0d12 55%, #050506 100%); }
.ledframe { position: absolute; inset: 0; transform-origin: 50% 40%; -webkit-box-reflect: below 24px linear-gradient(transparent 62%, rgba(255,255,255,.22)); }
.ledsrc { visibility: hidden; }
.bhcam { position: absolute; inset: 0; transform-origin: 540px 700px; }
.bhwords { position: absolute; left: 0; top: 0; width: 1080px; text-align: center; color: #fff; font-family: "Geist", sans-serif; }
.bh1 { position: absolute; left: 0; top: 220px; width: 1080px; font-size: 112px; font-weight: 800; letter-spacing: .02em; white-space: nowrap; }
.bh2 { position: absolute; left: 0; top: 360px; width: 1080px; font-size: 248px; font-weight: 900; letter-spacing: -.03em; line-height: 1; white-space: nowrap; }
.bhwords span { display: inline-block; text-shadow: 0 10px 40px rgba(0,0,0,.35); }
.bhblur { filter: blur(30px) brightness(.6); transform: scale(1.3); }
.bhfg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.vid.hidden { visibility: hidden; }
.dring, .pp-sticker { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
.doodles { position: absolute; inset: 0; }
.dtext { position: absolute; left: 90px; top: 1180px; font: italic 400 104px/1 "Instrument Serif", Georgia, serif; color: #fff; text-shadow: 0 4px 18px rgba(0,0,0,.6); transform-origin: 0 50%; }
.pp-base { position: absolute; inset: 0; background: #e6d8bd; overflow: hidden; }
.pp-grid { position: absolute; left: 90px; top: 520px; width: 900px; height: 1100px; background-color: #f7f5ef; background-image: linear-gradient(#cfd9e6 2px, transparent 2px), linear-gradient(90deg, #cfd9e6 2px, transparent 2px); background-size: 46px 46px; transform: rotate(-4deg); box-shadow: 0 10px 30px rgba(0,0,0,.18); }
.pp-y { position: absolute; left: -60px; top: 1180px; width: 640px; height: 520px; background: #f4cf3c; clip-path: polygon(0 8%, 22% 0, 48% 6%, 78% 1%, 100% 9%, 96% 92%, 70% 100%, 38% 95%, 8% 100%); transform: rotate(6deg); }
.pp-b { position: absolute; left: 620px; top: 300px; width: 520px; height: 560px; background: #a9cbee; clip-path: polygon(4% 0, 100% 5%, 94% 40%, 100% 78%, 90% 100%, 10% 96%, 0 60%); transform: rotate(-8deg); }
.pp-p { position: absolute; left: 30px; top: 1500px; width: 1020px; height: 120px; background: #f2a7bd; transform: rotate(-3deg); clip-path: polygon(0 20%, 100% 0, 98% 80%, 2% 100%); }
.pp-news { position: absolute; left: 40px; top: 360px; width: 420px; height: 380px; background: #ece8df; padding: 30px 26px; transform: rotate(5deg); box-shadow: 0 6px 18px rgba(0,0,0,.15); }
.pp-news i { display: block; height: 12px; margin-bottom: 22px; background: #8f8a80; border-radius: 3px; }
.pp-tape { position: absolute; width: 230px; height: 64px; background: rgba(245,235,205,.75); box-shadow: 0 2px 6px rgba(0,0,0,.12); }
.pp-tape.t1 { left: 100px; top: 500px; transform: rotate(-24deg); }
.pp-tape.t2 { left: 800px; top: 1480px; transform: rotate(18deg); }
.pp-letters { position: absolute; left: 0; top: 110px; width: 1080px; font-size: 112px; text-align: center; white-space: nowrap; z-index: 3; }
.pp-letters span { display: inline-block; margin: 0 3px; padding: .05em .12em; font-size: 1em; line-height: 1; box-shadow: 0 6px 12px rgba(0,0,0,.25); }
.pp-letters em { display: inline-block; width: .35em; }
.pp-letters .la { background: #fff; color: #1b1b1b; font-family: "Times New Roman", serif; font-weight: 700; }
.pp-letters .lb { background: #d93b2b; color: #fff; font-family: "Geist", sans-serif; font-weight: 900; }
.pp-letters .lc { background: #1b1b1b; color: #f4cf3c; font-family: "JetBrains Mono", monospace; font-weight: 800; }
.pp-letters .ld { background: #f4cf3c; color: #1b1b1b; font-family: Georgia, serif; font-style: italic; font-weight: 700; }
.pp-letters .le { background: #a9cbee; color: #13305a; font-family: "Geist", sans-serif; font-weight: 800; }
.pp-sticker { filter: drop-shadow(0 22px 26px rgba(0,0,0,.35)); transform-origin: 50% 60%; z-index: 2; }
.pp-x { position: absolute; left: 860px; top: 1260px; font: 900 140px/1 "Geist", sans-serif; color: #d93b2b; transform: rotate(12deg); z-index: 3; }
/* Série 2 (effets2.js) */
.vid.clone { transform-origin: 50% 100%; filter: brightness(.82) saturate(.9); }
.clflash { position: absolute; inset: 0; background: #fff; opacity: 0; }
.cltag { position: absolute; left: 50%; top: 1460px; font: 900 260px/1 "Geist", sans-serif; color: #fff; letter-spacing: -.04em; text-shadow: 0 12px 40px rgba(0,0,0,.55); }
.vhscv { position: absolute; inset: 0; width: 1080px; height: 1920px; filter: blur(.6px); }
.vhslines { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 2px, transparent 2px 6px); mix-blend-mode: multiply; }
.vhsband { position: absolute; left: 0; top: 0; width: 1080px; height: 90px; background: linear-gradient(transparent, rgba(255,255,255,.22) 45%, rgba(255,255,255,.35) 50%, rgba(255,255,255,.22) 55%, transparent); filter: blur(3px); }
.vhsnoise { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; opacity: .09; mix-blend-mode: screen; }
.vhsosd { position: absolute; inset: 0; font: 700 54px "JetBrains Mono", monospace; color: #f2f2f2; text-shadow: 3px 0 0 rgba(255,0,60,.7), -3px 0 0 rgba(0,200,255,.7), 0 0 10px rgba(255,255,255,.5); }
.vhsosd > div { position: absolute; }
.vp { left: 70px; top: 120px; } .vs { right: 70px; top: 120px; } .vr { right: 70px; top: 200px; color: #ff3b3b; }
.vd { left: 70px; bottom: 210px; } .vt { left: 70px; bottom: 140px; }
.neonbg { filter: brightness(.28) saturate(.5) contrast(1.1); }
.neontint { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 35%, rgba(60,20,120,.35), rgba(5,5,20,.75)); }
.neoncv { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; filter: drop-shadow(0 0 10px #ff2bd6) drop-shadow(0 0 26px #7a5cff); }
.neonmain { filter: drop-shadow(0 0 8px #00e5ff) drop-shadow(0 0 22px #00e5ff) drop-shadow(0 0 60px #00b3ff); }
.neonfg { filter: saturate(1.2) brightness(1.05); }
.neontxt { position: absolute; left: 0; width: 1080px; top: 1500px; text-align: center; font: italic 400 130px/1 "Instrument Serif", Georgia, serif; color: #ffe9fb;
  text-shadow: 0 0 6px #fff, 0 0 18px #ff2bd6, 0 0 40px #ff2bd6, 0 0 80px #ff2bd6; }
.mowrap { position: absolute; inset: 0; perspective: 1600px; transform-origin: 540px 960px; }
.motile { position: absolute; transform-style: preserve-3d; }
.moface { position: absolute; inset: 0; width: 100%; height: 100%; backface-visibility: hidden; overflow: hidden; }
.mofront { background: #d97757; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.moback { transform: rotateY(180deg); }
.moposter { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; text-align: center; color: #fff; font-family: "Geist", sans-serif; }
.mp1 { position: absolute; left: 0; width: 1080px; top: 640px; font-size: 120px; font-weight: 800; }
.mp2 { position: absolute; left: 0; width: 1080px; top: 780px; font-size: 230px; font-weight: 900; letter-spacing: -.04em; color: #1f1e1d; }
.mp3 { position: absolute; left: 0; width: 1080px; top: 1060px; font: italic 400 96px "Instrument Serif", Georgia, serif; }
.bdbg { position: absolute; inset: 0; background:
  radial-gradient(circle, rgba(200,30,20,.35) 2.6px, transparent 3px) 0 0 / 22px 22px,
  repeating-conic-gradient(from 0deg at 50% 38%, #ffcc1f 0 7deg, #ff9f1a 7deg 14deg); }
.bdcv { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 50% 100%; }
.bdpow { position: absolute; left: 30px; top: 220px; transform-origin: 50% 50%; filter: drop-shadow(6px 8px 0 rgba(0,0,0,.35)); }
.bdbubble { position: absolute; right: 40px; top: 300px; max-width: 560px; padding: 40px 46px; background: #fff; border: 7px solid #111; border-radius: 50%;
  font: italic 900 74px/1.02 "Geist", sans-serif; color: #111; text-align: center; transform-origin: 30% 100%; box-shadow: 8px 10px 0 rgba(0,0,0,.3); }
.bdbubble::after { content: ""; position: absolute; left: 90px; bottom: -58px; border: 30px solid transparent; border-top: 58px solid #111; border-bottom: 0; transform: skewX(-25deg); }
.bdframe { position: absolute; inset: 22px; border: 14px solid #111; outline: 22px solid #fff; pointer-events: none; }
.abzoom { position: absolute; inset: 0; }
.ablayer { position: absolute; inset: 0; overflow: hidden; }
.ablayer.abin { border: 22px solid #fff; border-radius: 60px; box-shadow: 0 30px 90px rgba(0,0,0,.7); }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module" src="js/lancer.js"></script>
</body>
</html>
